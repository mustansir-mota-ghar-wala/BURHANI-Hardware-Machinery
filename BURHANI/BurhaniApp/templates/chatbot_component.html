<style>
        /* Chat Widget Styles */
        .chat-fab {
            position: fixed;
            bottom: 85px; /* Above bottom app bar */
            right: 20px;
            background: linear-gradient(135deg, #ff4b4b 0%, #cc0000 100%);
            color: white;
            width: auto;
            padding: 0 16px;
            height: 48px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            box-shadow: 0 6px 20px rgba(204, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            z-index: 1040;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulse-glow 2.5s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(204, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(204, 0, 0, 0); }
        }
        .chat-fab:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 25px rgba(204, 0, 0, 0.5);
        }
        .chat-widget {
            position: fixed;
            bottom: 150px;
            right: 20px;
            width: 360px;
            height: 550px;
            max-width: calc(100vw - 40px);
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            z-index: 1100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--gg-border);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .chat-header {
            background: linear-gradient(135deg, var(--gg-header) 0%, #1a2522 100%);
            color: white;
            padding: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .chat-body {
            flex-grow: 1;
            padding: 1.2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: linear-gradient(180deg, #f8f9fa 0%, #ffffff 100%);
        }
        .chat-message {
            display: flex;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-message.bot {
            align-self: flex-start;
        }
        .chat-message.user {
            align-self: flex-end;
        }
        .message-content {
            padding: 0.8rem 1.2rem;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            font-family: 'Inter', sans-serif;
        }
        .bot .message-content {
            background: white;
            color: var(--gg-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .user .message-content {
            background: linear-gradient(135deg, var(--gg-accent) 0%, #d35400 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.25);
        }
        .chat-footer {
            padding: 1rem 1.2rem;
            background: white;
            border-top: 1px solid var(--gg-border);
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        .chat-footer input {
            flex-grow: 1;
            min-width: 0;
            border: 1.5px solid rgba(0,0,0,0.08);
            border-radius: 25px;
            padding: 0.6rem 1.2rem;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #f8f9fa;
        }
        .chat-footer input:focus {
            border-color: var(--gg-accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1);
        }
        .chat-footer button {
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-footer .btn-send {
            background: var(--gg-header);
        }
        .chat-footer .btn-send:hover {
            background: #1a2522;
            transform: scale(1.05);
        }
        .chat-footer .btn-mic {
            background: #e74c3c;
        }
        .chat-footer .btn-mic:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .chat-widget {
                bottom: 0;
                right: 0;
                width: 100vw;
                height: 85vh; /* Act like a bottom sheet */
                max-width: 100vw;
                border-radius: 28px 28px 0 0;
                border-top: 1px solid rgba(0, 0, 0, 0.08);
                box-shadow: 0 -10px 40px rgba(0,0,0,0.12);
                z-index: 1100;
            }
            .chat-header {
                padding: 1.5rem 1rem 1rem 1rem;
                border-radius: 28px 28px 0 0;
                position: relative;
                flex-wrap: wrap;
                gap: 10px;
            }
            .chat-header::before {
                content: '';
                display: block;
                width: 40px;
                height: 5px;
                background: rgba(255, 255, 255, 0.3);
                border-radius: 10px;
                position: absolute;
                top: 8px;
                left: 50%;
                transform: translateX(-50%);
                margin: 0;
            }
            .chat-fab {
                bottom: 130px;
                right: 15px;
                padding: 0 10px;
                height: 38px;
                font-size: 0.75rem;
                border-radius: 20px;
            }
            .chat-fab .bi {
                font-size: 1.1rem !important;
            }
            .chat-fab span {
                font-size: 0.75rem !important;
            }
            .qv-img-container { height: 260px !important; position: relative; }
            .qv-img-container::after {
                content: '';
                position: absolute;
                bottom: 0; left: 0; right: 0; height: 60px;
                background: linear-gradient(to bottom, transparent, white);
            }
            .qv-content-padding { padding: 1rem 1rem 0.75rem 1rem !important; margin-top: -25px; position: relative; z-index: 2; background: white; border-radius: 24px 24px 0 0; }
            #qvName { font-size: 1.15rem; line-height: 1.2; }
            #qvPrice { font-size: 1.25rem; margin-bottom: 0.25rem !important; }
            #qvDescription { 
                font-size: 0.8rem; 
                margin-bottom: 0.75rem !important; 
                color: #666 !important; 
                max-height: 80px;
                overflow-y: auto;
                padding-right: 5px;
            }
            /* Custom scrollbar for the description */
            #qvDescription::-webkit-scrollbar { width: 4px; }
            #qvDescription::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
            #qvDescription::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        }

        .qv-img-container { height: 280px; }
        .qv-content-padding { padding: 1.5rem; }
</style>
    <!-- Chat Widget -->
    <div id="chatWidget" class="chat-widget d-none">
        <div class="chat-header d-flex justify-content-between align-items-center">
            <h5 class="m-0 fs-6 fw-bold"><i class="bi bi-robot me-2 text-warning"></i>AI Help</h5>
            <div class="d-flex align-items-center gap-2">
                <div class="btn-group rounded-pill" role="group" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
                    <input type="radio" class="btn-check" name="chatLang" id="langEn" autocomplete="off" value="english" checked onchange="updateChatLanguage()">
                    <label class="btn btn-sm text-white fw-medium rounded-pill px-3" for="langEn" style="font-size: 0.75rem;" id="lblEn">English</label>
                    <input type="radio" class="btn-check" name="chatLang" id="langHi" autocomplete="off" value="hindi" onchange="updateChatLanguage()">
                    <label class="btn btn-sm text-white-50 fw-medium rounded-pill px-3" for="langHi" style="font-size: 0.75rem;" id="lblHi">हिंदी</label>
                </div>
                <button class="btn btn-sm text-white p-0 fs-5 ms-1" onclick="toggleChat()"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-message bot">
                <div class="message-content fw-medium">Hello! I am AI Help for Burhani Hardware. How can I help you find tools or machinery today?</div>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Ask about tools, products..." onkeypress="handleChatEnter(event)">
            <button onclick="document.getElementById('chatCameraInput').click()" class="btn-mic" style="background: rgba(41, 128, 185, 0.1); color: #2980b9;" title="Visual Search"><i class="bi bi-camera-fill"></i></button>
            <input type="file" accept="image/*" capture="environment" class="d-none" id="chatCameraInput" onchange="handleChatVisualSearch(event)">
            <button onclick="startVoiceInput()" id="micBtn" class="btn-mic"><i class="bi bi-mic-fill"></i></button>
            <button onclick="sendChatMessage()" class="btn-send"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>
    
    <button class="chat-fab" onclick="toggleChat()">
        <i class="bi bi-chat-dots-fill text-white fs-5"></i> <span class="ms-2 fw-bold text-uppercase" style="font-size: 0.85rem; letter-spacing: 1px;">AI Help</span>
    </button>

<script>
        function toggleChat() {
            const widget = document.getElementById('chatWidget');
            widget.classList.toggle('d-none');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const chatInput = document.getElementById('chatInput');
            if (chatInput) {
                chatInput.addEventListener('keypress', handleChatEnter);
            }
        });

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        let currentChatLang = 'english';
        
        function updateChatLanguage() {
            currentChatLang = document.querySelector('input[name="chatLang"]:checked').value;
            const lblEn = document.getElementById('lblEn');
            const lblHi = document.getElementById('lblHi');
            if (currentChatLang === 'english') {
                lblEn.classList.replace('text-white-50', 'text-white');
                lblHi.classList.replace('text-white', 'text-white-50');
            } else {
                lblHi.classList.replace('text-white-50', 'text-white');
                lblEn.classList.replace('text-white', 'text-white-50');
            }
        }

        function startVoiceInput() {
            const micBtn = document.getElementById('micBtn');
            const originalHtml = micBtn.innerHTML;
            
            recordAndTranscribe({
                lang: currentChatLang === 'hindi' ? 'hi' : 'en',
                onStart: () => {
                    micBtn.innerHTML = '<span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>';
                    micBtn.style.background = '#c0392b';
                },
                onResult: (transcript) => {
                    document.getElementById('chatInput').value = transcript;
                    sendChatMessage();
                },
                onError: (errorMsg) => {
                    console.error("Voice search error", errorMsg);
                },
                onEnd: () => {
                    micBtn.innerHTML = originalHtml;
                    micBtn.style.background = '#e74c3c';
                }
            });
        }

        async function handleChatVisualSearch(event) {
            const file = event.target.files[0];
            if (!file) return;

            appendMessage('user', '📷 Uploaded an image for search...');
            appendMessage('bot', '<span class="spinner-grow spinner-grow-sm text-warning" role="status" aria-hidden="true"></span> Analyzing image...');

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/api/visual-search/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                // Remove the "Analyzing image..." message
                const chatBody = document.getElementById('chatBody');
                chatBody.removeChild(chatBody.lastChild);

                if (data.status === 'success') {
                    if (data.products && data.products.length > 0) {
                        appendMessage('bot', "I analyzed the image and found these related products:");
                        
                        let productsHtml = '<div class="row g-2 mt-2">';
                        data.products.forEach(p => {
                            const imgHtml = p.image ? `<img src="${p.image}" class="img-fluid rounded" style="height:80px; object-fit:cover; width:100%;">` : '<div class="bg-light h-100 rounded d-flex align-items-center justify-content-center"><i class="bi bi-image text-muted"></i></div>';
                            productsHtml += `
                                <div class="col-6">
                                    <a href="#" class="text-decoration-none" onclick="openQuickView(${p.id}); return false;">
                                        <div class="card h-100 border-0 shadow-sm" style="border-radius:12px;">
                                            <div class="card-body p-2 text-center">
                                                ${imgHtml}
                                                <h6 class="mt-2 mb-1 text-dark text-truncate" style="font-size:0.75rem;">${p.name}</h6>
                                                <p class="mb-0 fw-bold text-accent" style="font-size:0.8rem;">₹${p.price}</p>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            `;
                        });
                        productsHtml += '</div>';
                        appendHtmlMessage('bot', productsHtml);
                    } else if (data.keywords && data.keywords.length > 0) {
                        appendMessage('bot', `I identified this as a "${data.keywords.join(', ')}", but couldn't find any exact matches in our inventory right now.`);
                    } else {
                        appendMessage('bot', "I couldn't identify any specific tools in that image.");
                    }
                } else {
                    appendMessage('bot', "Sorry, I had trouble analyzing that image. " + (data.message || ''));
                }
            } catch (err) {
                const chatBody = document.getElementById('chatBody');
                chatBody.removeChild(chatBody.lastChild);
                appendMessage('bot', "Connection error during image upload.");
            }
            
            event.target.value = '';
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            const language = currentChatLang;
            if (!message) return;

            input.value = '';
            appendMessage('user', message);

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, language: language })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    appendMessage('bot', data.reply);
                    if (data.products_html) {
                        appendHtmlMessage('bot', data.products_html);
                    }
                } else {
                    appendMessage('bot', "Sorry, I'm having trouble right now. Error: " + (data.message || 'Unknown error'));
                }
            } catch (err) {
                appendMessage('bot', "Connection error.");
            }
        }

        function appendMessage(sender, text) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${sender}`;
            msgDiv.innerHTML = `<div class="message-content fw-medium">${text.replace(/\\n/g, '<br>')}</div>`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function appendHtmlMessage(sender, htmlContent) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${sender}`;
            msgDiv.innerHTML = `<div class="message-content fw-medium w-100 p-2" style="background:transparent;box-shadow:none;">${htmlContent}</div>`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
    
    <!-- Product Quick View Modal -->
    <div class="modal fade" id="productQuickViewModal" tabindex="-1" aria-hidden="true" style="backdrop-filter: blur(8px); z-index: 1200;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 20px; overflow: hidden;">
                <div class="modal-header border-0 bg-light pb-0 position-absolute w-100" style="z-index: 10;">
                    <button type="button" class="btn-close bg-white rounded-circle p-2 shadow-sm" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="qvLoading" class="text-center py-5">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted fw-bold">Fetching details...</p>
                    </div>
                    <div id="qvContent" class="d-none">
                        <div class="row g-0">
                            <div class="col-12 qv-img-container" style="background: #f8f9fa;">
                                <img id="qvImage" src="" class="w-100 h-100" style="object-fit: cover;" alt="Product">
                            </div>
                            <div class="col-12 qv-content-padding">
                                <h4 id="qvName" class="fw-bold text-dark mb-2" style="font-family: 'Playfair Display', serif;"></h4>
                                <h3 id="qvPrice" class="fw-bold text-warning mb-3"></h3>
                                <p id="qvDescription" class="text-muted small mb-4" style="line-height: 1.6;"></p>
                                <a id="qvAddToCartBtn" href="#" class="btn btn-warning w-100 py-3 rounded-pill fw-bold text-dark shadow-sm">
                                    <i class="bi bi-cart-plus-fill me-2"></i>Add to Cart
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function openQuickView(productId) {
            const modalEl = document.getElementById('productQuickViewModal');
            let modal = bootstrap.Modal.getInstance(modalEl);
            if (!modal) {
                modal = new bootstrap.Modal(modalEl);
            }
            modal.show();
            
            document.getElementById('qvLoading').classList.remove('d-none');
            document.getElementById('qvContent').classList.add('d-none');
            
            try {
                const response = await fetch(`/api/product-quick-view/${productId}/`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    const p = data.product;
                    document.getElementById('qvName').textContent = p.name;
                    document.getElementById('qvPrice').textContent = `₹${p.price}`;
                    document.getElementById('qvDescription').textContent = p.description ? p.description : 'No description available.';
                    
                    const img = document.getElementById('qvImage');
                    if (p.image) {
                        img.src = p.image;
                        img.style.display = 'block';
                    } else {
                        img.style.display = 'none';
                    }
                    
                    document.getElementById('qvAddToCartBtn').href = `/add-to-cart/${p.id}/`;
                    
                    document.getElementById('qvLoading').classList.add('d-none');
                    document.getElementById('qvContent').classList.remove('d-none');
                } else {
                    document.getElementById('qvLoading').innerHTML = `<p class="text-danger mt-3 fw-bold">Error: ${data.message}</p>`;
                }
            } catch (err) {
                document.getElementById('qvLoading').innerHTML = '<p class="text-danger mt-3 fw-bold">Connection error.</p>';
            }
        }
    </script>
