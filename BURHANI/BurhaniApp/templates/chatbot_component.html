<style>
        /* Chat Widget Styles */
        .chat-fab {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #dc3545;
            color: white;
            width: auto;
            padding: 0 14px;
            height: 40px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            box-shadow: 0 6px 15px rgba(230, 126, 34, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            z-index: 1040;
            transition: 0.3s;
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        .chat-fab:hover {
            transform: scale(1.1);
        }
        .chat-widget {
            position: fixed;
            bottom: 160px;
            right: 20px;
            width: 350px;
            height: 500px;
            max-width: calc(100vw - 40px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            z-index: 1040;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--gg-border);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-header {
            background: var(--gg-header);
            color: white;
            padding: 1rem;
        }
        .chat-body {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: #f8f9fa;
        }
        .chat-message {
            display: flex;
            max-width: 80%;
        }
        .chat-message.bot {
            align-self: flex-start;
        }
        .chat-message.user {
            align-self: flex-end;
        }
        .message-content {
            padding: 0.8rem 1rem;
            border-radius: 15px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .bot .message-content {
            background: white;
            color: var(--gg-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user .message-content {
            background: var(--gg-accent);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(230, 126, 34, 0.2);
        }
        .chat-footer {
            padding: 1rem;
            background: white;
            border-top: 1px solid var(--gg-border);
            display: flex;
            gap: 0.5rem;
        }
        .chat-footer input {
            flex-grow: 1;
            border: 1px solid var(--gg-border);
            border-radius: 20px;
            padding: 0.5rem 1rem;
            outline: none;
        }
        .chat-footer button {
            background: var(--gg-header);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .chat-footer button:hover {
            background: var(--gg-accent);
        }

        @media (max-width: 768px) {
            .chat-widget {
                bottom: 0;
                right: 0;
                width: 100vw;
                height: 100vh;
                max-width: 100vw;
                border-radius: 0;
                z-index: 1100;
            }
            .chat-fab {
                bottom: 140px;
                right: 15px;
                width: auto;
                padding: 0 10px;
                height: 36px;
                font-size: 0.85rem;
            }
        }

</style>
    <!-- Chat Widget -->
    <div id="chatWidget" class="chat-widget d-none">
        <div class="chat-header d-flex justify-content-between align-items-center">
            <h5 class="m-0 fs-6 fw-bold"><i class="bi bi-robot me-2 text-warning"></i>Burhani Assistant</h5>
            <div class="d-flex align-items-center gap-2">
                <div class="btn-group rounded-pill" role="group" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
                    <input type="radio" class="btn-check" name="chatLang" id="langEn" autocomplete="off" value="english" checked onchange="updateChatLanguage()">
                    <label class="btn btn-sm text-white fw-medium rounded-pill px-3" for="langEn" style="font-size: 0.75rem;" id="lblEn">English</label>
                    <input type="radio" class="btn-check" name="chatLang" id="langHi" autocomplete="off" value="hindi" onchange="updateChatLanguage()">
                    <label class="btn btn-sm text-white-50 fw-medium rounded-pill px-3" for="langHi" style="font-size: 0.75rem;" id="lblHi">हिंदी</label>
                </div>
                <button class="btn btn-sm text-white p-0 fs-5 ms-1" onclick="toggleChat()"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-message bot">
                <div class="message-content fw-medium">Hello! I am your Burhani Hardware Assistant. How can I help you find tools or machinery today?</div>
            </div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Ask about tools, products..." onkeypress="handleChatEnter(event)">
            <button onclick="startVoiceInput()" id="micBtn" style="background: #e74c3c;"><i class="bi bi-mic-fill"></i></button>
            <button onclick="sendChatMessage()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>
    
    <button class="chat-fab" onclick="toggleChat()">
        <i class="bi bi-chat-dots-fill text-white"></i> <span class="ms-1 fw-bold" style="font-size: 0.85rem; letter-spacing: 0.5px;">HELP</span>
    </button>

<script>
        function toggleChat() {
            const widget = document.getElementById('chatWidget');
            if (widget.classList.contains('d-none')) {
                widget.classList.remove('d-none');
                document.getElementById('chatInput').focus();
            } else {
                widget.classList.add('d-none');
            }
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        let currentChatLang = 'english';
        
        function updateChatLanguage() {
            currentChatLang = document.querySelector('input[name="chatLang"]:checked').value;
            const lblEn = document.getElementById('lblEn');
            const lblHi = document.getElementById('lblHi');
            if (currentChatLang === 'english') {
                lblEn.classList.replace('text-white-50', 'text-white');
                lblHi.classList.replace('text-white', 'text-white-50');
            } else {
                lblHi.classList.replace('text-white-50', 'text-white');
                lblEn.classList.replace('text-white', 'text-white-50');
            }
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support voice input.");
                return;
            }
            
            const recognition = new SpeechRecognition();
            recognition.lang = currentChatLang === 'hindi' ? 'hi-IN' : 'en-IN';
            recognition.interimResults = false;
            
            const micBtn = document.getElementById('micBtn');
            const originalHtml = micBtn.innerHTML;
            
            recognition.onstart = () => {
                micBtn.innerHTML = '<span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>';
                micBtn.style.background = '#c0392b';
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('chatInput').value = transcript;
                sendChatMessage();
            };
            
            recognition.onerror = (event) => {
                console.error("Voice recognition error", event.error);
                micBtn.innerHTML = originalHtml;
                micBtn.style.background = '#e74c3c';
            };
            
            recognition.onend = () => {
                micBtn.innerHTML = originalHtml;
                micBtn.style.background = '#e74c3c';
            };
            
            recognition.start();
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            const language = currentChatLang;
            if (!message) return;

            input.value = '';
            appendMessage('user', message);

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, language: language })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    appendMessage('bot', data.reply);
                    if (data.products_html) {
                        appendHtmlMessage('bot', data.products_html);
                    }
                } else {
                    appendMessage('bot', "Sorry, I'm having trouble right now. Error: " + (data.message || 'Unknown error'));
                }
            } catch (err) {
                appendMessage('bot', "Connection error.");
            }
        }

        function appendMessage(sender, text) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${sender}`;
            msgDiv.innerHTML = `<div class="message-content fw-medium">${text.replace(/\\n/g, '<br>')}</div>`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function appendHtmlMessage(sender, htmlContent) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-message ${sender}`;
            msgDiv.innerHTML = `<div class="message-content fw-medium w-100 p-2" style="background:transparent;box-shadow:none;">${htmlContent}</div>`;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
</script>
