{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | Burhani Hardware</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: white; border-radius: 30px; padding: 4rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.05); max-width: 500px; }
        .error-icon { font-size: 5rem; color: #dc3545; margin-bottom: 2rem; }
        .btn-home { background: #0a110f; color: white; border-radius: 12px; padding: 1rem 2rem; font-weight: 700; text-decoration: none; display: inline-block; transition: 0.3s; }
        .btn-home:hover { background: #e67e22; color: white; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="bi bi-x-circle-fill"></i></div>
        <h1 class="fw-bold mb-3">Payment Failed</h1>
        <p class="text-muted mb-5">Something went wrong with your transaction. Please try again or contact support if the issue persists.</p>
        {% if error %}<p class="text-danger small mb-4">Error: {{ error }}</p>{% endif %}
        <a href="{% url 'checkout' %}" class="btn-home">Try Again</a>
    </div>
</body>
</html>
