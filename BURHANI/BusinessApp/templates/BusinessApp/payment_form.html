{% extends 'BusinessApp/base.html' %}

{% block content %}
<h1 class="h3 mb-4">Add Payment</h1>
<div class="card p-4">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-dark mt-3" type="submit">Save Payment</button>
        <a class="btn btn-outline-secondary mt-3" href="{% url 'business_payments' %}">Cancel</a>
    </form>
</div>
{% endblock %}
